<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flora | المنتجات</title>
  <style>
    :root { --cream:#faf8f4; --pink:#bf7787; --pink-dark:#925465; --beige:#ead7c8; --ink:#685450; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--cream); color:var(--ink); font-family:Tahoma, Arial, sans-serif; }
    a { color:inherit; text-decoration:none; }
    .topbar { padding:20px 7%; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #efe7e0; background:#fffdfa; }
    .logo { font:normal 42px Georgia,serif; color:#9b6c75; }
    .home-link { font-size:14px; border:1px solid #e2c6c7; border-radius:40px; padding:11px 18px; }
    .hero { padding:58px 20px 45px; text-align:center; background:linear-gradient(110deg,#faf7f2,#f1e1d8 75%,#f8ede7); }
    .eyebrow { font-size:13px; letter-spacing:1px; color:#b68c87; margin:0 0 9px; }
    h1 { font-size:36px; font-weight:400; margin:0 0 13px; color:#826269; }
    .hero p:last-child { margin:0; color:#8e7773; font-size:15px; }
    main { max-width:1180px; padding:38px 22px 70px; margin:auto; }
    .categories { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:37px; }
    .category-btn { cursor:pointer; padding:13px 22px; background:#fff; color:#906e74; border:1px solid #e3c9c7; border-radius:30px; font:14px Tahoma,Arial,sans-serif; transition:.2s; }
    .category-btn:hover,.category-btn.active { color:white; background:var(--pink); border-color:var(--pink); }
    .section-heading { text-align:center; margin-bottom:29px; }
    .section-heading h2 { font-size:25px; font-weight:400; margin:0 0 10px; }
    .flower-mark { color:#bf8996; }
    .grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:24px; }
    .card { min-width:0; overflow:hidden; border:1px solid #f1e8e1; background:#fff; border-radius:155px 155px 18px 18px; box-shadow:0 9px 25px #886b5d0d; }
    .card img { width:100%; height:275px; display:block; object-fit:cover; background:#e8dacf; border-radius:155px 155px 0 0; }
    .card-content { padding:22px 18px 20px; text-align:center; }
    .card h3 { font-size:17px; font-weight:400; line-height:1.6; min-height:30px; margin:0 0 10px; }
    .price { font-size:15px; color:var(--pink-dark); margin:0 0 20px; }
    .add-btn { background:var(--pink); color:#fff; border:none; border-radius:30px; padding:12px 21px; font:14px Tahoma,Arial,sans-serif; cursor:pointer; }
    .add-btn:hover { background:var(--pink-dark); }
    .cart-indicator { text-align:center; margin-top:33px; font-size:14px; color:#9e6876; }
    footer { padding:23px 20px; text-align:center; background:#f2e4da; font:14px Georgia,serif; color:#96747c; }
    @media(max-width:800px) { .grid {grid-template-columns:repeat(2,minmax(0,1fr));} .card img {height:230px;} }
    @media(max-width:540px) { .topbar {padding:15px 20px;} .logo {font-size:32px;} h1 {font-size:30px;} .grid {grid-template-columns:1fr;max-width:350px;margin:auto;} .card img {height:275px;} .hero {padding:43px 18px;} }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="home.html" aria-label="Flora - الصفحة الرئيسية">Flora</a>
    <a class="home-link" href="home.html">العودة للرئيسية ←</a>
  </header>

  <main>
    <nav class="categories" aria-label="أقسام المنتجات">
      <button class="category-btn" data-category="wholesale" type="button">ورود بالجملة</button>
      <button class="category-btn" data-category="bouquets" type="button">باقات الورد</button>
      <button class="category-btn" data-category="gifts" type="button">ورود مع هدايا</button>
    </nav>

    <section aria-live="polite">
      <div class="section-heading">
        <h2 id="category-title">باقات الورد</h2>
        <span class="flower-mark" aria-hidden="true">✿</span>
      </div>
      <div class="grid" id="product-grid"></div>
    </section>
    <p class="cart-indicator" id="cart-status">العناصر المضافة: 0</p>
  </main>

  <footer>Flora © 2026</footer>

  <script>
    // بيانات تجريبية: استبدلي أسماء المنتجات والأسعار والصور ببيانات متجركم الحقيقية.
    const catalog = {
      wholesale: {
        title: 'ورود بالجملة',
        products: [
          {name:'ورود توليب بالجملة', price:100, image:'images/flower1.png'},
          {name:'ورود اقحوان بالجملة', price:120, image:'images/flower2.png'},
          {name: 'ورود جوري بالجملة', price:150, image:'images/flower3.png'},
          {name: 'ورود ليليوم بالجملة', price:150, image:'images/flower4.png'}
        ]
      },
      bouquets: {
        title:'باقات الورد',
        products: [
          {name:'باقة التوليب الابيض', price:150, image:'images/flower5.png'},
          {name:'باقة الجوري الأحمر', price:180, image:'images/flower6.png'},
          {name:'باقة الليليوم الوردي', price:200, image:'images/flower7.png'},
          {name:'باقة دوار الشمس', price:200, image:'images/flower8.png'}

        ]
      },
      gifts: {
        title:'ورود مع هدايا',
        products: [
          {name:'ورد مع كيك', price:200, image:'images/flower9.png'},
          {name:'ورد مع شوكولاتة', price:200, image:'images/flower10.png'},
          {name:'ورد مع مجوهرات', price:200, image:'images/flower11.png'},
          {name:'ورد مع عطر', price:200, image:'images/flower12.png'}
        ]
      }
    };

    let cartCount = 0;
    const buttons = document.querySelectorAll('.category-btn');
    const grid = document.getElementById('product-grid');

    function showCategory(category, updateUrl = true) {
      if (!catalog[category]) category = 'bouquets';
      document.getElementById('category-title').textContent = catalog[category].title;
      buttons.forEach(button => {
        const active = button.dataset.category === category;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', String(active));
      });
      grid.replaceChildren();
      catalog[category].products.forEach(product => {
        const card = document.createElement('article');
        card.className = 'card';
        const img = document.createElement('img');
        img.src = product.image;
        img.alt = product.name;
        img.loading = 'lazy';
        const content = document.createElement('div');
        content.className = 'card-content';
        const name = document.createElement('h3');
        name.textContent = product.name;
        const price = document.createElement('p');
        price.className = 'price';
        price.textContent = product.price + ' ر.س';
        const add = document.createElement('button');
        add.className = 'add-btn';
        add.type = 'button';
        add.textContent = 'إضافة إلى السلة';
        add.addEventListener('click', () => {
          // هذا عداد تجريبي فقط؛ ربط السلة الحقيقية يتم مع كود زميلتك لاحقًا.
          cartCount++;
          document.getElementById('cart-status').textContent = 'العناصر المضافة: ' + cartCount;
        });
        content.append(name, price, add);
        card.append(img, content);
        grid.append(card);
      });
      if (updateUrl) {
        const url = new URL(window.location.href);
        url.searchParams.set('category', category);
        history.replaceState(null, '', url);
      }
    }

    buttons.forEach(button => button.addEventListener('click', () => showCategory(button.dataset.category)));
    const requestedCategory = new URLSearchParams(window.location.search).get('category');
    showCategory(requestedCategory || 'bouquets', false);
  </script>
</body>
</html>
